
baseURL = "https://blog.sagratini.net/"
locale = "en-us"
title = "Alessandro Sagratini"
theme = "PaperMod"
enableRobotsTXT = true
 
[pagination]
  pagerSize = 10
 
[params]
  description = "Notes on FreeBSD, networking and running infrastructure at home and at work"
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowShareButtons = true
  ShareButtons = ["linkedin", "x", "reddit", "ycombinator"]
 
[params.homeInfoParams]
  Title = "Hi, I'm Alessandro 👋"
  Content = """
SRE by day, running a slightly over-engineered home network by night.
Notes on FreeBSD, Linux, networking, high availability and automation:
what worked, what broke, and what I learned fixing it.
"""

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/asagratini"

[[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/alessandrosagratini/"
 
[markup.highlight]
  noClasses = false
